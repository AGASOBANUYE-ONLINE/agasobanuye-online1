
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rebaflm Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--gold:#d6ad55;--bg:#090909;--card:#171717}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:white;font-family:Arial,sans-serif}
header{padding:16px;background:#151515;border-bottom:1px solid #333;color:var(--gold);font-weight:bold;display:flex;justify-content:space-between;align-items:center}
main{max-width:950px;margin:20px auto;padding:12px}
.panel{background:var(--card);padding:18px;border-radius:10px;margin-bottom:18px}
h2,h3{color:var(--gold)}
input,textarea,select{width:100%;padding:12px;margin:7px 0 13px;background:#242424;color:white;border:1px solid #444;border-radius:6px}
textarea{min-height:75px}
label{font-size:13px;color:#ddd}
button{background:var(--gold);color:#111;border:0;padding:11px 15px;border-radius:5px;font-weight:bold;cursor:pointer;margin:4px}
.secondary{background:#333;color:white}
.danger{background:#8b2929;color:white}
.hidden{display:none}
.item,.entry{padding:13px;background:#242424;margin:9px 0;border-radius:7px}
.entry h3{margin-top:0}
#status,#loginStatus{padding:10px;color:var(--gold)}
hr{border:0;border-top:1px solid #444;margin:20px 0}
</style>
</head>
<body>

<header>
<span>REBAFLM — ADMIN</span>
<button class="secondary" id="logoutBtn" onclick="logout()" style="display:none">Logout</button>
</header>

<main>
<div id="loginPanel" class="panel">
<h2>Admin Login</h2>
<label>Email</label>
<input id="email" type="email" placeholder="Admin email">
<label>Password</label>
<input id="password" type="password" placeholder="Password">
<button onclick="login()">LOGIN</button>
<div id="loginStatus"></div>
</div>

<div id="dashboard" class="hidden">
<div class="panel">
<h2>Dashboard</h2>
<button onclick="showTab('movies')">Add Movies</button>
<button onclick="showTab('series')">Add Series</button>
<button onclick="showTab('seasons')">Seasons & Episodes</button>
<button onclick="showTab('manage')">Manage Content</button>
<div id="status"></div>
</div>

<div class="panel" id="moviesTab">
<h2>Add Multiple Movies</h2>
<div id="movieEntries"></div>
<button onclick="addMovieEntry()">+ Add Another Movie</button>
<button onclick="saveMovies()">SAVE ALL MOVIES</button>
</div>

<div class="panel hidden" id="seriesTab">
<h2>Add Multiple Series</h2>
<div id="seriesEntries"></div>
<button onclick="addSeriesEntry()">+ Add Another Series</button>
<button onclick="saveSeries()">SAVE ALL SERIES</button>
</div>

<div class="panel hidden" id="seasonsTab">
<h2>Add Multiple Seasons</h2>
<label>Select Series</label>
<select id="seasonMovie"></select>
<div id="seasonEntries"></div>
<button onclick="addSeasonEntry()">+ Add Another Season</button>
<button onclick="saveSeasons()">SAVE ALL SEASONS</button>

<hr>
<h2>Add Multiple Episodes</h2>
<label>Select Season</label>
<select id="episodeSeason"></select>
<div id="episodeEntries"></div>
<button onclick="addEpisodeEntry()">+ Add Another Episode</button>
<button onclick="saveEpisodes()">SAVE ALL EPISODES</button>
</div>

<div class="panel hidden" id="manageTab">
<h2>Manage Movies & Series</h2>
<div id="contentList">Loading...</div>
</div>
</div>
</main>

<script>
const SUPABASE_URL="https://xplntbsngafgcercowsp.supabase.co";
const SUPABASE_KEY="sb_publishable_GZyb3rumXDyVQhy1dflV-A_-IOklH4E";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function message(t){
 document.getElementById("status").textContent=t;
}

function escapeHtml(s){
 return String(s||"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const out=document.getElementById("loginStatus");
 out.textContent="Signing in...";
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){out.textContent="Login failed: "+error.message;return}
 const {data:admin,error:adminError}=await db.from("admins")
 .select("user_id").eq("user_id",data.user.id).maybeSingle();
 if(adminError||!admin){
  await db.auth.signOut();
  out.textContent="This account is not an administrator.";
  return;
 }
 openDashboard();
}

function openDashboard(){
 document.getElementById("loginPanel").classList.add("hidden");
 document.getElementById("dashboard").classList.remove("hidden");
 document.getElementById("logoutBtn").style.display="inline-block";
 refreshData();
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

function showTab(tab){
 ["movies","series","seasons","manage"].forEach(x=>{
  document.getElementById(x+"Tab").classList.toggle("hidden",x!==tab);
 });
}

function movieFields(type){
 const prefix=type+"-"+Date.now()+"-"+Math.random().toString(36).slice(2);
 return `
 <div class="entry" data-entry="${prefix}">
 <h3>${type==="movie"?"Movie":"Series"}</h3>
 <label>Title</label><input data-f="title" placeholder="Title">
 <label>Description</label><textarea data-f="synopsis"></textarea>
 <label>Release Year</label><input data-f="year" type="number">
 <label>Country</label><input data-f="country">
 <label>Category</label>
 <select data-f="category">
 <option>Action</option><option>Romance</option><option>Horror</option>
 <option>Indian</option><option>Cartoon</option><option>Sci-fi</option>
 <option>Drama</option><option>Comedy</option><option>Others</option>
 </select>
 <label>Translator</label><input data-f="translator">
 <label>Poster URL</label><input data-f="poster" type="url">
 <label>Trailer URL</label><input data-f="trailer" type="url">
 <label>Download URL (used by OPEN and DOWNLOAD)</label>
 <input data-f="full" type="url">
 <label>Publish</label>
 <select data-f="published"><option value="true">Published</option><option value="false">Draft</option></select>
 <button class="danger" onclick="this.closest('.entry').remove()">Remove</button>
 </div>`;
}

function addMovieEntry(){
 document.getElementById("movieEntries").insertAdjacentHTML("beforeend",movieFields("movie"));
}

function addSeriesEntry(){
 document.getElementById("seriesEntries").insertAdjacentHTML("beforeend",movieFields("series"));
}

function readMovieEntries(container,type){
 return [...document.querySelectorAll("#"+container+" .entry")].map(el=>{
  const v=k=>el.querySelector(`[data-f="${k}"]`).value.trim();
  return {
   title:v("title"),synopsis:v("synopsis"),
   release_year:v("year")?Number(v("year")):null,
   country:v("country"),category:v("category"),
   content_type:type,translator:v("translator"),
   poster_url:v("poster"),trailer_url:v("trailer"),
   download_url:v("full"),
   is_published:v("published")==="true"
  };
 });
}

async function saveBatch(container,type){
 const records=readMovieEntries(container,type);
 if(!records.length){message("Add at least one item.");return}
 if(records.some(x=>!x.title)){
  message("Please enter a title for every item.");
  return;
 }
 const {error}=await db.from("movies").insert(records);
 if(error){message("Save failed: "+error.message);return}
 message("Saved "+records.length+" items successfully.");
 document.getElementById(container).innerHTML="";
 if(type==="series")await refreshData();
}

async function saveMovies(){
 await saveBatch("movieEntries","movie");
}

async function saveSeries(){
 await saveBatch("seriesEntries","series");
}

function addSeasonEntry(){
 document.getElementById("seasonEntries").insertAdjacentHTML("beforeend",`
 <div class="entry">
 <label>Season Number</label><input data-f="number" type="number" value="1">
 <label>Season Title</label><input data-f="title" placeholder="Season 1">
 <label>Season Download URL</label><input data-f="full" type="url">
 <button class="danger" onclick="this.closest('.entry').remove()">Remove</button>
 </div>`);
}

async function saveSeasons(){
 const movie_id=document.getElementById("seasonMovie").value;
 if(!movie_id){message("Select a series first.");return}
 const rows=[...document.querySelectorAll("#seasonEntries .entry")].map(el=>({
  movie_id,
  season_number:Number(el.querySelector('[data-f="number"]').value),
  title:el.querySelector('[data-f="title"]').value.trim(),
  download_url:el.querySelector('[data-f="full"]').value.trim()
 }));
 if(!rows.length){message("Add at least one season.");return}
 if(rows.some(x=>!x.title)){message("Enter every season title.");return}
 const {error}=await db.from("seasons").insert(rows);
 if(error){message("Season error: "+error.message);return}
 document.getElementById("seasonEntries").innerHTML="";
 message("Seasons saved successfully.");
 await loadSeasonOptions();
}

function addEpisodeEntry(){
 document.getElementById("episodeEntries").insertAdjacentHTML("beforeend",`
 <div class="entry">
 <label>Episode Number</label><input data-f="number" type="number" value="1">
 <label>Episode Title</label><input data-f="title">
 <label>Episode Trailer URL</label><input data-f="trailer" type="url">
 <label>Episode Download URL</label><input data-f="full" type="url">
 <button class="danger" onclick="this.closest('.entry').remove()">Remove</button>
 </div>`);
}

async function saveEpisodes(){
 const season_id=document.getElementById("episodeSeason").value;
 if(!season_id){message("Select a season first.");return}
 const rows=[...document.querySelectorAll("#episodeEntries .entry")].map(el=>({
  season_id,
  episode_number:Number(el.querySelector('[data-f="number"]').value),
  title:el.querySelector('[data-f="title"]').value.trim(),
  trailer_url:el.querySelector('[data-f="trailer"]').value.trim(),
  download_url:el.querySelector('[data-f="full"]').value.trim()
 }));
 if(!rows.length){message("Add at least one episode.");return}
 if(rows.some(x=>!x.title)){message("Enter every episode title.");return}
 const {error}=await db.from("episodes").insert(rows);
 if(error){message("Episode error: "+error.message);return}
 document.getElementById("episodeEntries").innerHTML="";
 message("Episodes saved successfully.");
}

async function refreshData(){
 const {data,error}=await db.from("movies").select("*").order("created_at",{ascending:false});
 if(error){message(error.message);return}
 const all=data||[];
 document.getElementById("contentList").innerHTML=all.map(m=>`
 <div class="item">
 <strong>${escapeHtml(m.title)}</strong><br>
 <small>${escapeHtml(m.content_type||"movie")} · ${m.is_published?"Published":"Draft"}</small><br>
 <button onclick="editContent('${m.id}')">Edit</button>
 <button class="danger" onclick="deleteContent('${m.id}')">Delete</button>
 </div>`).join("")||"No content yet.";
 const series=all.filter(m=>m.content_type==="series");
 document.getElementById("seasonMovie").innerHTML=
 series.map(s=>`<option value="${s.id}">${escapeHtml(s.title)}</option>`).join("");
 await loadSeasonOptions();
}

async function loadSeasonOptions(){
 const movie_id=document.getElementById("seasonMovie").value;
 const select=document.getElementById("episodeSeason");
 if(!movie_id){select.innerHTML="";return}
 const {data,error}=await db.from("seasons").select("*")
 .eq("movie_id",movie_id).order("season_number");
 if(error){message(error.message);return}
 select.innerHTML=(data||[]).map(s=>
 `<option value="${s.id}">Season ${s.season_number} — ${escapeHtml(s.title)}</option>`
 ).join("");
}

document.getElementById("seasonMovie").addEventListener("change",loadSeasonOptions);

async function editContent(id){
 const {data:m,error}=await db.from("movies").select("*").eq("id",id).single();
 if(error){message(error.message);return}
 const series=m.content_type==="series";
 showTab(series?"series":"movies");
 const container=series?"seriesEntries":"movieEntries";
 const type=series?"series":"movie";
 document.getElementById(container).innerHTML=movieFields(type);
 const el=document.querySelector("#"+container+" .entry");
 const set=(k,v)=>{
  const field=el.querySelector(`[data-f="${k}"]`);
  if(field)field.value=v??"";
 };
 set("title",m.title);set("synopsis",m.synopsis);
 set("year",m.release_year);set("country",m.country);
 set("category",m.category);set("translator",m.translator);
 set("poster",m.poster_url);set("trailer",m.trailer_url);
 set("full",m.download_url);set("published",String(!!m.is_published));
 const btn=document.createElement("button");
 btn.textContent="UPDATE";
 btn.onclick=async()=>{
  const record=readMovieEntries(container,type)[0];
  if(!record.title){message("Enter a title.");return}
  const {error}=await db.from("movies").update(record).eq("id",id);
  if(error){message(error.message);return}
  message("Content updated.");
  document.getElementById(container).innerHTML="";
  await refreshData();
 };
 el.appendChild(btn);
}

async function deleteContent(id){
 if(!confirm("Delete this content?"))return;
 const {error}=await db.from("movies").delete().eq("id",id);
 message(error?"Delete failed: "+error.message:"Content deleted.");
 await refreshData();
}

addMovieEntry();
addSeriesEntry();

(async()=>{
 const {data}=await db.auth.getSession();
 if(data.session){
  const {data:admin}=await db.from("admins").select("user_id")
  .eq("user_id",data.session.user.id).maybeSingle();
  if(admin)openDashboard();
  else await db.auth.signOut();
 }
})();
</script>
</body>
</html>
